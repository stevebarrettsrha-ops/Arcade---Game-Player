<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0e1120">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="assets/icon.svg">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<title>ARCADE · Phone Keypad</title>
<style>
  :root{ --cyan:#3fe0cf; --amber:#f2b545; --bg:#0e1120; --ink:#eef0f6; --muted:#aab0c3; --faint:#8b92a8; --ui:#a99bff; --ui-ink:#12142a; --line:rgba(255,255,255,.12); }
  @font-face{font-family:'Chakra Petch';font-weight:400 500;font-style:normal;src:url('assets/fonts/ChakraPetch-Medium.ttf') format('truetype');font-display:swap}
  @font-face{font-family:'Chakra Petch';font-weight:600 700;font-style:normal;src:url('assets/fonts/ChakraPetch-Bold.ttf') format('truetype');font-display:swap}
  .ic{width:1.15em;height:1.15em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.18em}
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; }
  html,body{ margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--ink);
    font-family:"Chakra Petch",system-ui,sans-serif; touch-action:none; overscroll-behavior:none; }
  body{ position:fixed; inset:0; }

  #pad{ position:fixed; inset:0; display:flex; flex-direction:column;
    padding:max(8px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left)); }

  /* top status bar */
  .bar{ display:flex; align-items:center; gap:10px; height:34px; flex:0 0 auto; }
  .dot{ width:9px; height:9px; border-radius:50%; background:#e0584f; box-shadow:0 0 8px #e0584f; transition:.2s; }
  .dot.on{ background:#5fe0a0; box-shadow:0 0 8px #5fe0a0; }
  .brand{ font-weight:700; font-size:14px; letter-spacing:.5px; color:var(--ink); }
  .room{ font-family:"Chakra Petch",sans-serif; font-weight:700; font-size:12.5px; letter-spacing:2px; color:var(--amber);
    background:rgba(242,181,69,.12); padding:3px 8px; border-radius:6px; }
  .sp{ flex:1; }
  .tbtn{ display:inline-flex; align-items:center; gap:6px; font-family:"Chakra Petch",sans-serif; font-weight:700; font-size:13px; letter-spacing:.3px; color:var(--ink);
    text-decoration:none; background:#1b1e33; border:1px solid var(--line); border-radius:9px; padding:7px 11px; cursor:pointer; }
  .tbtn:active{ filter:brightness(1.4); }

  .hint{ flex:0 0 auto; text-align:center; font-size:13px; color:var(--muted); padding:6px 0 6px; }

  /* play area: vertically stacked like a real handset */
  .body{ flex:1; min-height:0; display:flex; flex-direction:column; align-items:center; justify-content:space-evenly; gap:10px; }

  .pbtn{ touch-action:none; display:grid; place-items:center; color:var(--ink);
    font-family:"Chakra Petch",sans-serif; font-weight:700; cursor:pointer;
    background:linear-gradient(180deg,#2a2e4a,#171a2e); border:1px solid rgba(255,255,255,.10);
    box-shadow:0 5px 0 rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.08);
    transition:transform .04s,filter .04s,box-shadow .04s; border-radius:12px; }
  .pbtn.on{ transform:translateY(4px); filter:brightness(1.55);
    box-shadow:0 1px 0 rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.08); }

  /* soft keys (top, like below a phone screen) */
  .softs{ display:flex; gap:14px; width:100%; max-width:460px; }
  .soft{ flex:1; height:8vh; min-height:46px; font-size:14px; letter-spacing:.5px; gap:8px; grid-auto-flow:column;
    background:linear-gradient(180deg,#2a2e4a,#171a2e); }
  .soft .lbl{ font-size:12px; color:var(--faint); font-weight:500; }

  /* D-pad cross + center fire (3x3 grid) */
  .navwrap{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px;
    width:54vw; max-width:240px; aspect-ratio:1/1; }
  .navwrap .pbtn{ font-size:24px; }
  .nav-up{ grid-area:1/2; } .nav-left{ grid-area:2/1; }
  .fire{ grid-area:2/2; border-radius:50%; font-size:15px; letter-spacing:1px;
    background:var(--ui); color:var(--ui-ink); }
  .navwrap .fire{ font-size:15px; }
  .nav-right{ grid-area:2/3; } .nav-down{ grid-area:3/2; }

  /* numeric keypad 1-9, * 0 # */
  .keys{ display:grid; grid-template-columns:repeat(3,1fr); gap:9px;
    width:72vw; max-width:360px; }
  .keys .pbtn{ aspect-ratio:1.5/1; font-size:22px; }
  .keys .pbtn .sub{ display:block; font-size:11px; color:var(--faint); margin-top:-2px; letter-spacing:1px; font-weight:500; }

  #toast{ position:fixed; left:50%; bottom:14px; transform:translateX(-50%); background:#141726;
    border:1px solid var(--line); color:var(--ink); font-size:14px; padding:9px 14px; border-radius:10px;
    opacity:0; transition:.2s; pointer-events:none; z-index:30; }
  #toast.show{ opacity:1; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
  <symbol id="i-phone" viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18h2"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16zM13.5 6.5l4 4"/></symbol>
  <symbol id="i-expand" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></symbol>
  <symbol id="i-gamepad" viewBox="0 0 24 24"><path d="M7 7h10a5 5 0 0 1 5 5v1.5a3.5 3.5 0 0 1-6.3 2.1L15 15H9l-.7.6A3.5 3.5 0 0 1 2 13.5V12a5 5 0 0 1 5-5z"/><path d="M7 10.5v3M5.5 12h3M16 11h0M18 13h0"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z" fill="currentColor"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></symbol>
  <symbol id="i-stick" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.5"/></symbol>
  <symbol id="i-rotate" viewBox="0 0 24 24"><path d="M20 5v5h-5"/><path d="M19.5 10A8 8 0 1 0 20 14"/></symbol>
</defs></svg>
  <div id="pad">
    <div class="bar">
      <span class="dot" id="dot"></span>
      <span class="brand">ARCADE</span>
      <span class="room" id="room">----</span>
      <span class="sp"></span>
      <a class="tbtn" id="gamepadBtn" href="#" title="Back to the gamepad"><svg class="ic" aria-hidden="true"><use href="#i-gamepad"/></svg> Gamepad</a>
      <button class="tbtn" id="fsBtn"><svg class="ic" aria-hidden="true"><use href="#i-expand"/></svg> Full</button>
    </div>
    <div class="hint">Java phone keypad — for KEmulator games running on the host</div>

    <div class="body">
      <!-- soft keys -->
      <div class="softs">
        <div class="pbtn soft" data-btn="soft1">LEFT<span class="lbl">soft key</span></div>
        <div class="pbtn soft" data-btn="soft2">RIGHT<span class="lbl">soft key</span></div>
      </div>

      <!-- D-pad + fire -->
      <div class="navwrap">
        <div class="pbtn nav-up"    data-btn="up">▲</div>
        <div class="pbtn nav-left"  data-btn="left">◀</div>
        <div class="pbtn fire"      data-btn="fire">FIRE</div>
        <div class="pbtn nav-right" data-btn="right">▶</div>
        <div class="pbtn nav-down"  data-btn="down">▼</div>
      </div>

      <!-- numeric keypad -->
      <div class="keys">
        <div class="pbtn" data-btn="num1">1</div>
        <div class="pbtn" data-btn="num2">2<span class="sub">ABC</span></div>
        <div class="pbtn" data-btn="num3">3<span class="sub">DEF</span></div>
        <div class="pbtn" data-btn="num4">4<span class="sub">GHI</span></div>
        <div class="pbtn" data-btn="num5">5<span class="sub">JKL</span></div>
        <div class="pbtn" data-btn="num6">6<span class="sub">MNO</span></div>
        <div class="pbtn" data-btn="num7">7<span class="sub">PQRS</span></div>
        <div class="pbtn" data-btn="num8">8<span class="sub">TUV</span></div>
        <div class="pbtn" data-btn="num9">9<span class="sub">WXYZ</span></div>
        <div class="pbtn" data-btn="star">✱</div>
        <div class="pbtn" data-btn="num0">0</div>
        <div class="pbtn" data-btn="hash">#</div>
      </div>
    </div>
  </div>
  <div id="toast"></div>

<script>
  const $ = s => document.querySelector(s);

  // room code from URL (?room=CODE or ?pad=CODE); fall back to the last one we
  // saw, so opening the keypad directly still works. Host-emulator input is
  // injected regardless of room, so we connect/send even when it's blank.
  const Q = new URL(location.href);
  let ROOM = (Q.searchParams.get('room') || Q.searchParams.get('pad') || '').toUpperCase().slice(0,8);
  try { if (ROOM) localStorage.setItem('arcade_room', ROOM); else ROOM = (localStorage.getItem('arcade_room') || '').toUpperCase().slice(0,8); } catch(e){}
  $('#room').textContent = ROOM || 'HOST';
  $('#gamepadBtn').href = 'pad.html?room=' + encodeURIComponent(ROOM);

  function vibe(ms){ try{ navigator.vibrate && navigator.vibrate(ms||12); }catch(e){} }
  let toastT=null;
  function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),1400); }

  // stable controller id (kept consistent with the gamepad page)
  const CID = (()=>{ try{ let c=sessionStorage.getItem('arcade_cid'); if(!c){ c=Math.random().toString(36).slice(2,10); sessionStorage.setItem('arcade_cid',c); } return c; }
                     catch(e){ return Math.random().toString(36).slice(2,10); } })();

  // ---- send to the host via the server relay (WebSocket, POST fallback) ----
  function setLinked(on){ $('#dot').classList.toggle('on', !!on); }
  let padWS = null, wsReady = false;
  function openWS(){
    try{
      const proto = location.protocol==='https:' ? 'wss:' : 'ws:';
      const ws = new WebSocket(proto+'//'+location.host+'/ws?room='+encodeURIComponent(ROOM)+'&role=pad');
      ws.onopen = () => { padWS = ws; wsReady = true; setLinked(true); try{ ws.send(JSON.stringify({t:'hello', cid:CID})); }catch(e){} };
      ws.onclose = () => { padWS = null; wsReady = false; setLinked(false); setTimeout(openWS, 1500); };
      ws.onerror = () => { try{ ws.close(); }catch(e){} };
    }catch(e){}
  }
  async function postMsg(o){
    try{
      const r = await fetch('/input?room='+encodeURIComponent(ROOM), { method:'POST', body:JSON.stringify(o), keepalive:true });
      const j = await r.json().catch(()=>({}));
      setLinked(!!(j && j.ok));   // host accepted it (injection doesn't need a TV in the room)
    }catch(e){ setLinked(false); }
  }
  function sendMsg(o){
    if(wsReady && padWS){ try{ padWS.send(JSON.stringify(o)); return; }catch(e){ wsReady = false; } }
    postMsg(o);
  }
  // k:1 => inject as a KEYBOARD key on the host (works even in gamepad mode), p:0 => single player
  const send = (t,b) => sendMsg({ t, b, k:1, p:0 });

  // ---- buttons (multitouch) ----
  function press(el, on){ el.classList.toggle('on', on); }
  const held = new Map();   // pointerId -> {el, btn}
  function bindButtons(){
    document.querySelectorAll('.pbtn[data-btn]').forEach(el=>{
      const b = el.dataset.btn;
      el.addEventListener('pointerdown', e=>{
        e.preventDefault(); try{ el.setPointerCapture(e.pointerId); }catch(_){}
        held.set(e.pointerId, { el, btn:b }); press(el,true); vibe(); send('down',b);
      });
      const release = e => {
        const h = held.get(e.pointerId); if(!h) return; held.delete(e.pointerId);
        press(h.el,false); send('up',h.btn);
      };
      el.addEventListener('pointerup', release);
      el.addEventListener('pointercancel', release);
    });
    // safety net: if a pointer is lost, release everything still held
    window.addEventListener('pointercancel', ()=>{ held.forEach(h=>{ press(h.el,false); send('up',h.btn); }); held.clear(); });
    window.addEventListener('blur', ()=>{ held.forEach(h=>{ press(h.el,false); send('up',h.btn); }); held.clear(); });
  }

  // fullscreen toggle
  $('#fsBtn').addEventListener('click', ()=>{
    try{ if(!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); }catch(e){}
  });

  bindButtons();
  openWS();
  if(!ROOM) toast('Host keypad — drives the game running on the host PC.');
</script>
</body>
</html>
